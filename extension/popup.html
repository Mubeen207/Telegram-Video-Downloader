<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0B0E14;
      color: #F8FAFC;
      margin: 0;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .icon {
      width: 28px;
      height: 28px;
      background: linear-gradient(135deg, #00C6FF 0%, #0072FF 100%);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
    h3 {
      margin: 0;
      font-size: 14px;
    }
    p {
      font-size: 12px;
      color: #94A3B8;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .status {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34D399;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 12px;
    }
    .btn {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #0072FF 0%, #00C6FF 100%);
      color: #FFF;
      text-align: center;
      padding: 10px 0;
      border-radius: 8px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">TG</div>
    <h3>TG Video Downloader</h3>
  </div>
  <div class="status">✓ Active on Telegram Web</div>
  <p>Open <strong>web.telegram.org</strong>, play any public or restricted video, and click the floating <strong>Download HD</strong> button.</p>
  <a href="http://localhost:8000" target="_blank" class="btn">Open Web App Dashboard</a>
</body>
</html>
